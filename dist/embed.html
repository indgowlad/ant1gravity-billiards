<!doctype html>
<html lang="en">
  <head>
    <title>ANT1GRAVITY · Billar 8-Ball</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta
      name="description"
      content="ANT1GRAVITY billiards — embedded pool game with realistic physics, top-down view, 8-ball mode."
    />
    <meta name="robots" content="index,follow" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta http-equiv="Permissions-Policy" content="interest-cohort=()" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"
    />
    <link rel="stylesheet" type="text/css" href="css/fonts.css" />
    <link rel="stylesheet" type="text/css" href="css/index.css" />
    <link rel="stylesheet" type="text/css" href="css/aiminputs.css" />
    <link rel="stylesheet" type="text/css" href="css/powerinput.css" />
    <link rel="stylesheet" type="text/css" href="css/notification.css" />
    <link rel="stylesheet" type="text/css" href="css/wood.css" />
  </head>

  <body>
    <div id="viewP1" class="view3d">
      <div id="snookerScoreOverlay">
        <div id="snookerScore" aria-live="polite">
          <div id="p1Score" class="p1Score"></div>
          <div id="p2Score" class="p2Score"></div>
          <div id="breakScore" class="breakScore"></div>
        </div>
      </div>
    </div>

    <!-- Control panel: hit button, cue ball hit point, power slider -->
    <div id="panel" class="panel wood-texture">
      <div class="aimControlColumn">
        <div class="aimingArea">
          <button
            class="hitButton timeout-btn"
            id="cueHit"
            type="button"
            aria-label="Hit cue ball"
          >
            hit
          </button>
        </div>
        <div id="tiltSliderContainer" class="tiltSliderContainer" hidden>
          <angle-input id="cueTilt" aria-label="tilt angle"></angle-input>
        </div>
        <template id="angle-input-template">
          <div class="area" id="area">
            <div class="ball"></div>
            <div class="rotator" id="rot">
              <div class="stick">
                <div class="tip"></div>
                <div class="ferrule"></div>
                <div class="shaft"></div>
                <div class="butt"></div>
              </div>
            </div>
          </div>
        </template>
        <div id="ballContainerWrapper" class="ballContainerWrapper">
          <button id="openElevation" class="openElevation">+</button>
          <div id="ballContainer" class="ballContainer">
            <div id="objectBall" class="objectBall"></div>
            <div id="cueBall" class="cueBall">
              <div id="cueTip" class="cueTip"></div>
            </div>
          </div>
        </div>
      </div>
      <div id="powerSliderContainer" class="powerSliderContainer">
        <div class="power-track"></div>
        <input
          class="powerSlider"
          type="range"
          min="0"
          max="1"
          step="0.01"
          value="0.75"
          id="cuePower"
          aria-label="power slider"
        />
      </div>
    </div>

    <!-- Notifications (toast messages from the game) -->
    <div id="notification" class="notification" hidden></div>

    <script defer src="three_core.js"></script>
    <script defer src="three_module.js"></script>
    <script defer src="three_examples.js"></script>
    <script defer src="messaging.js"></script>
    <script defer src="interact.js"></script>
    <script defer src="index.js"></script>
    <script>
      // ANT1GRAVITY: force eightball mode if no ruletype passed
      ;(function () {
        var p = new URLSearchParams(location.search)
        if (!p.has("ruletype")) {
          p.set("ruletype", "eightball")
          var newSearch = "?" + p.toString()
          if (location.search !== newSearch) {
            history.replaceState(null, "", location.pathname + newSearch)
          }
        }
        document.getElementById("viewP1").style.height = "100%"
      })()
    </script>
  </body>
</html>
